# The add-on's names, set here only. build.sh hands this file to PillTaskbar's
# tools/build-addon.sh, whose addon/addon.conf describes every key.
# Paths are relative to this file's folder. Lists are space separated.

ADDON_ID="memory-clean"
ADDON_NAME="MemoryClean"
ADDON_VERSION="0.1.4"
ADDON_MOD_SRC="mod/memory-clean.wh.cpp"
ADDON_MOD_VERSION="0.1.4"
# Never a Windhawk mod; an id no one uses keeps the Windhawk check quiet.
ADDON_WINDHAWK_MODS="local@memory-clean"
# The four taskbar.dll symbols that lead to the taskbar's XAML.
ADDON_SYMBOL_MODULES="taskbar.dll"
# Bloom's page carries the look (pill.theme, pill.glass), which Bloom sets to its own;
# everything else lives in the add-on's window. build.sh makes settings.schema.json with
# this folder's tools/names-en.tsv, so PillTaskbar's step stays off here.
ADDON_SCHEMA="0"
ADDON_VALUES_DEFAULTS=""
ADDON_THIRD_PARTY="THIRD_PARTY.md"

# addon.json
ADDON_NAME_KO="메모리 정리"
ADDON_NAME_EN="Memory Clean"
ADDON_ABOUT_KO="작업표시줄 시계 옆에서 메모리 사용률을 보고 비우고, 프로그램을 끝냅니다"
ADDON_ABOUT_EN="Shows memory use next to the taskbar clock, frees memory and ends programs"
ADDON_LICENSE="GPL-3.0-only"
ADDON_SOURCE="https://github.com/hyeon1035298/MemoryClean_BloomAddon"
ADDON_MIN_BLOOM="0.19.0"
ADDON_NEEDS=""
